[package]
name = "openmind-desktop"
version = "0.2.0"
description = "OpenMind Desktop — local-first desktop assistant with pluggable model backends."
authors = ["OpenMind Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "openmind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-shell = "2.3"
tauri-plugin-fs = "2.5"
tauri-plugin-store = "2.4"
reqwest = { version = "0.13", features = ["json", "form", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
rusqlite = { version = "0.40", features = ["bundled", "vtab"] }
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
keyring-core = "0.7"
futures-util = "0.3"
base64 = "0.22"
rand = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"
